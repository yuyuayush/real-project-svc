events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Internal Docker DNS resolver for dynamic IP resolution upon container restart
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream payment_backend {
        # Least connections or round-robin across scaled Docker container instances
        least_conn;
        server payment-api:5000 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name localhost;

        # Add header showing which container serviced the request
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for webhooks and SSE if needed
        proxy_buffering off;
        proxy_read_timeout 60s;

        location / {
            proxy_pass http://payment_backend;
            
            # Automatically retry on another instance if one instance crashed/restarting
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }
    }
}
